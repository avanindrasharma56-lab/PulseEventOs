server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: eventflow-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/event_management_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${APP_JWT_SECRET:4c696e6b4f664576656e74735072656d69756d53656375726974794b6579323032364576656e74466c6f77}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

pulse:
  payment:
    currency: ${PULSE_PAYMENT_CURRENCY:USD}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:sk_test_pulse_sandbox_key}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_pulse_sandbox_test}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_pulse_sandbox_key}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_whsec_pulse_sandbox}
  mail:
    enabled: ${PULSE_MAIL_ENABLED:true}
    from: ${PULSE_MAIL_FROM:noreply@eventpulse.io}
    from-name: ${PULSE_MAIL_FROM_NAME:PulseEvent OS}

